[package]
name = "dox_http_native-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
dox_http_native = { path = ".." }

# its own workspace, so it is not part of the main build
[workspace]
members = ["."]

[[bin]]
name = "parse_head"
path = "fuzz_targets/parse_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked_body"
path = "fuzz_targets/chunked_body.rs"
test = false
doc = false
bench = false
