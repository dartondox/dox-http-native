[package]
name = "dox_http_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# rlib: the fuzz crate in fuzz/ links the parser
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.11.1"
bytes = "1.12.1"
flate2 = "1.1.10"
getrandom = "0.4.3"
httparse = "1.10.1"
httpdate = "1.0.3"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
slab = "0.4.12"
socket2 = { version = "0.6.5", features = ["all"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints.rust]
# cargo fuzz builds with `--cfg fuzzing`, see src/run.rs `mod fuzz`
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
