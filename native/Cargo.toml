[package]
name = "dox_http_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.10"
httparse = "1.10.1"
httpdate = "1.0.3"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
slab = "0.4.12"
socket2 = { version = "0.6.5", features = ["all"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
