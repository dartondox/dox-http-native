name: CI

# Every push to main and every pull request: format and analyze of all
# packages, then the Rust checks and the Dart tests of each package.
# Every pull request also builds the 5 native targets of both libraries.
# Thus a change that does not build on one target (eg. a dependency with
# C code) fails before a release, not at the tag.
#
# The Release workflow (release.yaml) runs this workflow first on a tag.
# With `package` set it also builds the 5 targets of that package for the
# release.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_call:
    inputs:
      package:
        description: Build the 5 native targets of this package (dox_http_native or dox_http_client)
        type: string
        default: ''

permissions:
  contents: read

env:
  # the oldest glibc that the Linux libraries load on
  GLIBC: "2.34"
  # zig's clang 21 refuses the AVX-512 code of libdeflate (the gzip of
  # dox_http_native): it wants an `evex512` target feature that libdeflate
  # does not name. Apple clang and gcc build it. These two switches of
  # libdeflate leave that code out for x86-64 Linux. CRC-32 then uses the
  # PCLMULQDQ code: about 0.1 us more for a 6.7 kB body.
  CFLAGS_x86_64_unknown_linux_gnu: >-
    -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX512VNNI
    -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_VPCLMULQDQ

jobs:
  # Pub workspace: one `dart pub get` at the root links all packages.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: Dart checks
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos .
      # the checks of pub.dev (eg. a private key in a file), so a release
      # does not fail at the publish step
      - name: Publish dry run
        run: |
          for p in packages/dox-http-native packages/dox-http-client; do
            (cd "$p" && dart pub publish --dry-run)
          done

  # also on a release tag: a red test stops the build, the release and the publish
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/dox-http-native/native
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      # zig is the linker of the Linux libraries: it links the unwinder into
      # the library, so the library does not need libgcc_s, and it sets the
      # glibc floor
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@0.24.1
      # the build is kept: the Dart build hook uses native/target/release.
      # It is built as a release builds it, so the Dart tests use the same
      # type of library that a release ships.
      - name: Rust checks
        working-directory: packages/dox-http-native/native
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
          cargo zigbuild --release --target "x86_64-unknown-linux-gnu.$GLIBC"
          cp target/x86_64-unknown-linux-gnu/release/libdox_http_native.so target/release/
          ../tool/check_linux_lib.sh target/release/libdox_http_native.so "$GLIBC"
      - name: Resolve the workspace
        run: dart pub get
      - name: Dart tests
        working-directory: packages/dox-http-native
        run: |
          dart test --concurrency=1
          # the HTTP/1.1 tests again, with HTTP/2 on: nothing may change
          DOX_TEST_HTTP2=1 dart test --concurrency=1 test/server_test.dart

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/dox-http-client/native
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      # zig: see test-native
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@0.24.1
      # the build is kept: the Dart build hook uses native/target/release
      - name: Rust checks
        working-directory: packages/dox-http-client/native
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
          cargo zigbuild --release --target "x86_64-unknown-linux-gnu.$GLIBC"
          cp target/x86_64-unknown-linux-gnu/release/libdox_http_client.so target/release/
          ../tool/check_linux_lib.sh target/release/libdox_http_client.so "$GLIBC"
      - name: Resolve the workspace
        run: dart pub get
      # THIRD_PARTY_NOTICES must list the crates of native/Cargo.lock
      - name: Check the third party notices
        working-directory: packages/dox-http-client
        run: dart run tool/third_party_notices.dart --check
      # the HTTPS tests make their certificates with openssl
      - name: Dart tests
        working-directory: packages/dox-http-client
        run: |
          command -v openssl
          dart test --concurrency=1

  # HTTP/2 conformance: h2spec (strict) against a small Dart server with
  # `http2: true` (tool/h2spec_server.dart). All tests must pass but one:
  # 3.5/2 sends a bad preface. On a port with HTTP/2 and HTTP/1.1, a bad
  # preface is not HTTP/2, so it goes to HTTP/1.1 and gets 400 (by design,
  # not a GOAWAY). h2spec has no exclude flag, so the job lists all specs
  # with 3.5/1 alone in place of 3.5.
  # Then all specs on a TLS port (`--tls`, h2spec -t): there ALPN picks
  # HTTP/2, so a bad preface closes the connection and 3.5/2 passes.
  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/dox-http-native/native
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: Build
        working-directory: packages/dox-http-native/native
        run: cargo build --release
      - name: Start the server
        working-directory: packages/dox-http-native
        run: |
          dart pub get
          dart run tool/h2spec_server.dart 8080 > server.log 2>&1 &
          dart run tool/h2spec_server.dart 8443 --tls > tls.log 2>&1 &
          for _ in $(seq 60); do
            grep -q listening server.log && grep -q listening tls.log && exit 0
            sleep 1
          done
          cat server.log tls.log
          exit 1
      - name: h2spec
        env:
          H2SPEC: summerwind/h2spec:2.6.0@sha256:5f4a65c30cae8569558ced048b4bfe0dcf01a221e36767ae504ccd8348a7aeb0
        run: |
          run() { docker run --rm --network host "$H2SPEC" -p 8080 -P /stream --strict "$@"; }
          run generic hpack http2/3.5/1 http2/4 http2/5 http2/6 http2/7 http2/8
          # a failed test must fail the job: 3.5/2 fails by design (above)
          if run http2/3.5/2 > /dev/null; then
            echo "::error::h2spec did not fail on a failed test"
            exit 1
          fi
      # -k: the test certificate is not trusted
      - name: h2spec on TLS
        env:
          H2SPEC: summerwind/h2spec:2.6.0@sha256:5f4a65c30cae8569558ced048b4bfe0dcf01a221e36767ae504ccd8348a7aeb0
        run: docker run --rm --network host "$H2SPEC" -p 8443 -t -k -P /stream --strict

  # every PR builds the 5 targets of both libraries, so a Windows break
  # shows before a release. A release builds only its own package.
  build:
    if: github.event_name == 'pull_request' || inputs.package
    needs: [lint, test-native, test-client, h2spec]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package && format('["{0}"]', inputs.package) || '["dox_http_native", "dox_http_client"]') }}
        platform:
          - { os: macos-latest, target: aarch64-apple-darwin, file: 'lib{0}.dylib', asset: '{0}-macos-arm64.dylib' }
          - { os: macos-latest, target: x86_64-apple-darwin, file: 'lib{0}.dylib', asset: '{0}-macos-x64.dylib' }
          # zig: built with `cargo zigbuild` for the glibc floor in `GLIBC`
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: 'lib{0}.so', asset: '{0}-linux-x64.so', zig: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: 'lib{0}.so', asset: '{0}-linux-arm64.so', zig: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: '{0}.dll', asset: '{0}-windows-x64.dll' }
    runs-on: ${{ matrix.platform.os }}
    env:
      TARGET: ${{ matrix.platform.target }}
      FILE: ${{ format(matrix.platform.file, matrix.package) }}
      ASSET: ${{ format(matrix.platform.asset, matrix.package) }}
      ZIG: ${{ matrix.platform.zig }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
      # zig is the linker of the Linux libraries: it links the unwinder into
      # the library, so the library does not need libgcc_s, and it sets the
      # glibc floor
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.platform.zig
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: matrix.platform.zig
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build
        shell: bash
        run: |
          # dox_http_native is in packages/dox-http-native
          cd "packages/${PACKAGE//_/-}/native"
          if [ "$ZIG" = "true" ]; then
            cargo zigbuild --release --target "$TARGET.$GLIBC"
            ../tool/check_linux_lib.sh "target/$TARGET/release/$FILE" "$GLIBC"
          else
            cargo build --release --target "$TARGET"
          fi
          mkdir -p ../../../dist
          cp "target/$TARGET/release/$FILE" "../../../dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format(matrix.platform.asset, matrix.package) }}
          path: dist/${{ format(matrix.platform.asset, matrix.package) }}
