[package]
name = "dox_http_client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
brotli-decompressor = "6.3.2"
flate2 = "1.1.11"
httparse = "1.10.1"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
slab = "0.4.12"
webpki-roots = "1.0.12"

[lints.rust]
# cargo fuzz builds with `--cfg fuzzing`, see src/lib.rs `mod fuzz`
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
rcgen = "0.14.10"
