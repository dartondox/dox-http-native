name: dox_http_client
description: Fast native HTTP client for Dart, with HTTP/1.1, HTTP/2, HTTPS and keep-alive. Rust owns the sockets and parses the answers through dart:ffi.
version: 0.0.6
repository: https://github.com/dartondox/dox-http-native
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  hooks: ^2.2.0
  http: ^1.6.0

dev_dependencies:
  # the tests of the Dart team for clients of package:http
  http_client_conformance_tests:
    git:
      url: https://github.com/dart-lang/http.git
      path: pkgs/http_client_conformance_tests
      ref: 8751f5c6ea6e29f6e259006091d3ad0bcbc64b3e
  http2: ^3.2.0
  lints: ^6.1.0
  test: ^1.33.0
