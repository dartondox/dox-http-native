name: dox_http_client
description: Fast native HTTP/1.1 client for Dart, with HTTPS and keep-alive. Rust owns the sockets and parses the answers through dart:ffi.
version: 3.2.0
repository: https://github.com/dartondox/dox-http-native
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  hooks: ^2.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
